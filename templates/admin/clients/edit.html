{% extends "base.html" %}

{% block title %}Editar Cliente - Mediotec S.A.S.{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="page-title">
            <i class="bi bi-pencil"></i> Editar Cliente
        </h1>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.edit_client', client_id=client.id) }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre del Cliente</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ client.name }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="contact_email" class="form-label">Email de Contacto</label>
                        <input type="email" class="form-control" id="contact_email" name="contact_email"
                            value="{{ client.contact_email }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="phone" name="phone" value="{{ client.phone or '' }}">
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="address" name="address"
                            value="{{ client.address or '' }}">
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="id_type" class="form-label">Tipo de Identificación</label>
                            <select class="form-select" id="id_type" name="id_type">
                                <option value="">(Opcional)</option>
                                <option value="DNI" {% if client.id_type == 'DNI' %}selected{% endif %}>DNI</option>
                                <option value="CUIT" {% if client.id_type == 'CUIT' %}selected{% endif %}>CUIT</option>
                                <option value="OTRO" {% if client.id_type == 'OTRO' %}selected{% endif %}>OTRO</option>
                            </select>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label for="id_number" class="form-label">Número de Identificación</label>
                            <input type="text" class="form-control" id="id_number" name="id_number"
                                value="{{ client.id_number or '' }}" placeholder="Número de documento o CUIT">
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if
                            client.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">
                            Cliente Activo
                        </label>
                    </div>

                    <div class="alert alert-info">
                        <strong>Información:</strong> Creado: {{ client.created_at.strftime('%d/%m/%Y %H:%M') }}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-circle"></i> Guardar Cambios
                        </button>
                        <a href="{{ url_for('admin.list_clients') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
