{% extends "base.html" %}

{% block title %}Editar Usuario - Mediotec S.A.S.{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="page-title">
            <i class="bi bi-pencil"></i> Editar Usuario
        </h1>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.edit_user', user_id=user.id) }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username"
                            value="{{ user.username }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">Rol</label>
                        <select class="form-select" id="role" name="role" required>
                            {% for role in roles %}
                            <option value="{{ role }}" {% if user.role==role %}selected{% endif %}>
                                {% if role == 'admin' %}
                                Administrador
                                {% elif role == 'firefighter' %}
                                Bombero
                                {% else %}
                                Cliente
                                {% endif %}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if
                            user.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">
                            Usuario Activo
                        </label>
                    </div>

                    <div class="alert alert-info">
                        <strong>Información:</strong> Creado: {{ user.created_at.strftime('%d/%m/%Y %H:%M') }}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-circle"></i> Guardar Cambios
                        </button>
                        <a href="{{ url_for('admin.list_users') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
