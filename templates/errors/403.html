{% extends "base.html" %}

{% block title %}Acceso Denegado - Firewatch{% endblock %}

{% block content %}
<div class="row justify-content-center" style="min-height: calc(100vh - 200px); display: flex; align-items: center;">
    <div class="col-md-6 text-center">
        <h1 style="font-size: 5rem; color: #dc3545; font-weight: 700;">403</h1>
        <h2 class="mb-3">Acceso Denegado</h2>
        <p class="text-muted mb-4">
            No tienes permisos para acceder a este recurso. Por favor, contacta con tu administrador si crees que esto es un error.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
            <i class="bi bi-house"></i> Ir a Inicio
        </a>
    </div>
</div>
{% endblock %}
