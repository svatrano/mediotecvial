{% extends "base.html" %}

{% block title %}Error Interno del Servidor - Firewatch{% endblock %}

{% block content %}
<div class="row justify-content-center" style="min-height: calc(100vh - 200px); display: flex; align-items: center;">
    <div class="col-md-6 text-center">
        <h1 style="font-size: 5rem; color: #dc3545; font-weight: 700;">500</h1>
        <h2 class="mb-3">Error Interno del Servidor</h2>
        <p class="text-muted mb-4">
            Algo salió mal en el servidor. Nuestro equipo ha sido notificado del problema. Por favor, intenta más tarde.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
            <i class="bi bi-house"></i> Ir a Inicio
        </a>
    </div>
</div>
{% endblock %}
